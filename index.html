<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>শোরুম হিসাব</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#76746d;--bd:#e3e1da;--ac:#0f6e56;--ac2:#fff;--rd:#b3261e;--pay:#185fa5;--buy:#b45f06}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151513;--card:#201f1c;--tx:#f0eee8;--mu:#a09d94;--bd:#33312c;--ac:#3ec9a0;--ac2:#06251c;--rd:#f2877f;--pay:#6fb0ee;--buy:#f0a952}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151513;--card:#201f1c;--tx:#f0eee8;--mu:#a09d94;--bd:#33312c;--ac:#3ec9a0;--ac2:#06251c;--rd:#f2877f;--pay:#6fb0ee;--buy:#f0a952}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;font-size:16px;max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:4px 0 12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.sum small{color:var(--mu);display:block;font-size:12px}
.sum b{font-size:18px}
.sum .tot{grid-column:1/3;background:var(--ac);color:var(--ac2);border:0}
.sum .tot small{color:inherit;opacity:.8}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--ac2);font-size:16px;font-weight:600}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.item .n{font-weight:600}.item .d{color:var(--mu);font-size:13px;margin-top:2px}
.item .a{font-weight:700;text-align:right;white-space:nowrap}
.item .x{background:none;border:0;color:var(--rd);font-size:13px;padding:4px 0}
.empty{color:var(--mu);text-align:center;padding:20px}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}.gh{display:flex;justify-content:space-between;gap:10px;padding:10px 12px}.gh .n{font-weight:600}.gh .d{color:var(--mu);font-size:13px;margin-top:2px}.gh .a{font-weight:700;white-space:nowrap}.dl{font-size:13px;margin-top:2px;color:var(--rd)}.ga{display:flex;gap:6px;padding:0 12px 10px}.ga button{flex:1;padding:9px;border:1px solid var(--ac);background:none;color:var(--ac);border-radius:8px;font-size:14px;font-weight:600}.ga button.s{border-color:var(--bd);color:var(--mu);font-weight:400}.en{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--bd);font-size:14px}.en .d{color:var(--mu);font-size:12px}.en .x{background:none;border:0;color:var(--rd);font-size:12px;padding:2px 0}.foot{display:flex;gap:8px;margin-top:14px}
.foot button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
</style>
</head>
<body>
<h1>শোরুম ইন্টেরিয়র হিসাব</h1>
<div class="sum">
  <div><small>মোট পেমেন্ট (কাকে দিলাম)</small><b id="sp">৳0</b></div>
  <div><small>মোট মাল কেনা</small><b id="sb">৳0</b></div>
  <div class="tot"><small>সর্বমোট খরচ</small><b id="st">৳0</b></div>
</div>
<div class="tabs">
  <button id="t1" class="on" onclick="tab('pay')">পেমেন্ট</button>
  <button id="t2" onclick="tab('buy')">মাল কেনা</button>
</div>
<form id="f" onsubmit="return add(event)">
  <input id="date" type="date" required>
  <input id="name" list="nl" required autocomplete="off"><datalist id="nl"></datalist>
  <input id="note">
  <div class="row"><input id="qty" placeholder="পরিমাণ (ঐচ্ছিক)"><input id="amt" type="number" inputmode="decimal" min="0" placeholder="টাকা" required></div>
  <button class="go" type="submit">যোগ করুন</button>
</form>
<div id="list"></div>
<div class="foot"><button onclick="copyAll()">সব হিসাব কপি করুন</button></div>
<div class="foot"><button onclick="backup()">ব্যাকআপ কপি করুন</button><button onclick="showRestore()">ব্যাকআপ ফেরত আনুন</button></div>
<div id="rb" style="display:none;margin-top:10px"><textarea id="rt" rows="5" placeholder="এখানে ব্যাকআপের লেখা পেস্ট করুন" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px"></textarea><button class="go" style="width:100%;margin-top:6px" onclick="doRestore()">ফেরত আনুন</button></div>
<script>
var cur='pay',S={pay:[],buy:[],deal:{}},ex={},names=[];
try{var r=localStorage.getItem('showroom-hisab');if(r)S=JSON.parse(r)}catch(e){}
if(!S.deal)S.deal={};
function save(){try{localStorage.setItem('showroom-hisab',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function fm(n){return '৳'+Number(n).toLocaleString('bn-BD')}
function sum(a){return a.reduce(function(s,x){return s+x.amt},0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tab(t){cur=t;$('t1').className=t=='pay'?'on':'';$('t2').className=t=='buy'?'on':'';
 $('name').placeholder=t=='pay'?'কাকে দিলাম (নাম)':'দোকান / সরবরাহকারীর নাম';
 $('note').placeholder=t=='pay'?'কিসের জন্য (যেমন: কাঠমিস্ত্রি, রঙ, ইলেকট্রিক)':'কী মাল কিনলাম';
 $('qty').style.display=t=='buy'?'':'none';render()}
function add(e){e.preventDefault();
 S[cur].unshift({id:Date.now(),date:$('date').value,name:$('name').value.trim(),note:$('note').value.trim(),qty:$('qty').value.trim(),amt:parseFloat($('amt').value)||0});
 ex[cur+'|'+S[cur][0].name]=true;save();$('name').value='';$('note').value='';$('qty').value='';$('amt').value='';render();return false}
function del(id){if(!confirm('এই এন্ট্রি মুছবেন?'))return;S[cur]=S[cur].filter(function(x){return x.id!==id});save();render()}
function render(){
 $('sp').textContent=fm(sum(S.pay));$('sb').textContent=fm(sum(S.buy));$('st').textContent=fm(sum(S.pay)+sum(S.buy));
 var a=S[cur],g={};names=[];
 a.forEach(function(x){if(!g[x.name]){g[x.name]=[];names.push(x.name)}g[x.name].push(x)});
 $('nl').innerHTML=names.map(function(n){return '<option value="'+esc(n)+'">'}).join('');
 var col=cur=='pay'?'pay':'buy';
 $('list').innerHTML=names.length?names.map(function(n,i){
  var arr=g[n],t=sum(arr),dl=S.deal[cur+'|'+n],k=cur+'|'+n;
  var h='<div class="grp"><div class="gh" onclick="tg('+i+')"><div><div class="n">'+esc(n)+'</div><div class="d">'+arr.length+' বার • সর্বশেষ '+esc(arr[0].date)+'</div>'+(dl?'<div class="dl">চুক্তি '+fm(dl)+' • বাকি '+fm(dl-t)+'</div>':'')+'</div><div class="a" style="color:var(--'+col+')">'+fm(t)+'</div></div>';
  h+='<div class="ga"><button onclick="more('+i+')">'+(cur=='pay'?'+ আরো দিলাম':'+ আরো কিনলাম')+'</button><button class="s" onclick="deal('+i+')">চুক্তির টাকা</button><button class="s" onclick="tg('+i+')">'+(ex[k]?'লুকান':'হিসাব দেখুন')+'</button></div>';
  if(ex[k])h+=arr.map(function(x){return '<div class="en"><div><div>'+esc(x.note||'—')+(x.qty?' • '+esc(x.qty):'')+'</div><div class="d">'+esc(x.date)+'</div><button class="x" onclick="del('+x.id+')">মুছুন</button></div><b>'+fm(x.amt)+'</b></div>'}).join('');
  return h+'</div>'}).join(''):'<div class="empty">এখনো কিছু যোগ করা হয়নি</div>'}
function tg(i){var k=cur+'|'+names[i];ex[k]=!ex[k];render()}
function more(i){$('name').value=names[i];$('amt').focus();$('f').scrollIntoView({behavior:'smooth'})}
function deal(i){var v=prompt('"'+names[i]+'" এর সাথে চুক্তির মোট টাকা কত? (মুছতে ০ দিন)');if(v===null)return;v=parseFloat(v)||0;var k=cur+'|'+names[i];if(v>0)S.deal[k]=v;else delete S.deal[k];save();render()}
function copyAll(){
 var t='পেমেন্ট:\n'+S.pay.map(function(x){return x.date+' | '+x.name+' | '+x.note+' | '+x.amt}).join('\n')+'\nমোট: '+sum(S.pay)+'\n\nমাল কেনা:\n'+S.buy.map(function(x){return x.date+' | '+x.name+' | '+x.note+' '+x.qty+' | '+x.amt}).join('\n')+'\nমোট: '+sum(S.buy)+'\n\nসর্বমোট: '+(sum(S.pay)+sum(S.buy));
 try{navigator.clipboard.writeText(t).then(function(){alert('কপি হয়েছে')},function(){alert('কপি করা যায়নি')})}catch(e){alert('কপি করা যায়নি')}}
function backup(){var t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(function(){alert('ব্যাকআপ কপি হয়েছে। এবার নতুন অ্যাপে গিয়ে "ব্যাকআপ ফেরত আনুন" চাপুন।')},function(){$('rb').style.display='block';$('rt').value=t;alert('নিচের লেখা সব সিলেক্ট করে কপি করুন')})}catch(e){$('rb').style.display='block';$('rt').value=t}}
function showRestore(){$('rb').style.display='block';$('rt').value=''}
function doRestore(){try{var d=JSON.parse($('rt').value.trim());if(!d||!Array.isArray(d.pay)||!Array.isArray(d.buy))throw 1;if(!confirm('এই অ্যাপের বর্তমান হিসাব মুছে ব্যাকআপের হিসাব বসাবেন?'))return;S={pay:d.pay,buy:d.buy,deal:d.deal||{}};save();$('rb').style.display='none';render();alert('হিসাব ফেরত এসেছে')}catch(e){alert('ব্যাকআপের লেখা ঠিক নেই। পুরোটা কপি করে বসান।')}}
$('date').value=new Date().toISOString().slice(0,10);
tab('pay');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
